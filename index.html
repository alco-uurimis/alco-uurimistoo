    function LucideIcon({ name, className = "w-5 h-5", ...props }) {
      const iconRef = useRef(null);

      useLayoutEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            nameAttr: 'data-lucide',
            attrs: { class: className }
          });
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center" {...props} />;
    }

    // Interactive Neural Canvas Background
    function NeuralCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          if (canvas.parentElement) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
          }
        };
        resize();
        window.addEventListener('resize', resize);

        const particles = Array.from({ length: 45 }).map(() => ({
          x: Math.random() * (canvas.width || 800),
          y: Math.random() * (canvas.height || 400),
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          radius: Math.random() * 2 + 1.5
        }));

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 110) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(99, 102, 241, ${0.25 * (1 - dist / 110)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#818cf8';
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(draw);
        };

        draw();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-40" />;
    }

    // MEMORY GAME
    function MemoryGame({ lang }) {
      const [gameState, setGameState] = useState('idle');
      const [currentWords, setCurrentWords] = useState([]);
      const [selectedWords, setSelectedWords] = useState([]);
      const [optionsGrid, setOptionsGrid] = useState([]);
      const [timer, setTimer] = useState(6);
      const [distractionAnswer, setDistractionAnswer] = useState('');
      const [distractionMath, setDistractionMath] = useState({ a: 7, b: 8 });

      const startTask = () => {
        const wordBank = WORD_BANK_I18N[lang] || WORD_BANK_I18N.et;
        const randomSet = wordBank[Math.floor(Math.random() * wordBank.length)];
        setCurrentWords(randomSet);

        const num1 = Math.floor(Math.random() * 12) + 5;
        const num2 = Math.floor(Math.random() * 12) + 5;
        setDistractionMath({ a: num1, b: num2 });
        setDistractionAnswer('');

        const distractors = DISTRACTORS_I18N[lang] || DISTRACTORS_I18N.et;
        const combined = [...randomSet, ...distractors].sort(() => Math.random() - 0.5);
        setOptionsGrid(combined);

        setSelectedWords([]);
        setGameState('memorizing');
        setTimer(6);
      };

      useEffect(() => {
        let interval = null;
        if (gameState === 'memorizing' && timer > 0) {
          interval = setInterval(() => setTimer(prev => prev - 1), 1000);
        } else if (gameState === 'memorizing' && timer === 0) {
          setGameState('distraction');
        }
        return () => clearInterval(interval);
      }, [gameState, timer]);

      const toggleWordSelect = (word) => {
        if (selectedWords.includes(word)) {
          setSelectedWords(selectedWords.filter(w => w !== word));
        } else {
          if (selectedWords.length < 8) {
            setSelectedWords([...selectedWords, word]);
          }
        }
      };

      const calculateScore = () => {
        let score = 0;
        selectedWords.forEach(w => {
          if (currentWords.includes(w)) score++;
        });
        return score;
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-8 space-y-4 bg-slate-950/40 rounded-2xl border border-slate-800">
              <button
                onClick={startTask}
                className="px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white text-sm transition shadow-lg shadow-indigo-600/20 active:scale-95"
              >
                Start Memory Task
              </button>
            </div>
          )}

          {gameState === 'memorizing' && (
            <div className="text-center py-8 space-y-6 bg-slate-950/60 rounded-2xl border border-slate-800 px-4">
              <div className="flex items-center justify-center space-x-2 text-indigo-400 font-bold text-lg">
                <span>Timer: {timer}s</span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3 max-w-lg mx-auto">
                {currentWords.map((word, idx) => (
                  <div key={idx} className="p-3 bg-slate-800 rounded-xl font-bold text-indigo-200 border border-slate-700 text-xs sm:text-sm">
                    {word}
                  </div>
                ))}
              </div>
            </div>
          )}

          {gameState === 'distraction' && (
            <div className="text-center py-8 space-y-4 bg-slate-950/60 rounded-2xl border border-slate-800 max-w-md mx-auto px-4">
              <form onSubmit={(e) => { e.preventDefault(); setGameState('recall'); }} className="space-y-4">
                <div className="text-2xl font-extrabold text-indigo-300">
                  {distractionMath.a} + {distractionMath.b} = ?
                </div>
                <input
                  type="number"
                  value={distractionAnswer}
                  onChange={(e) => setDistractionAnswer(e.target.value)}
                  required
                  autoFocus
                  className="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-center text-white font-bold w-32 focus:outline-none text-base"
                />
                <div>
                  <button type="submit" className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white text-xs sm:text-sm transition">
                    Next
                  </button>
                </div>
              </form>
            </div>
          )}

          {gameState === 'recall' && (
            <div className="space-y-6 bg-slate-950/60 p-4 sm:p-6 rounded-2xl border border-slate-800">
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-3">
                {optionsGrid.map((word, idx) => (
                  <button
                    key={idx}
                    onClick={() => toggleWordSelect(word)}
                    className={`p-3 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                      selectedWords.includes(word)
                        ? 'bg-indigo-600 text-white border-indigo-400'
                        : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                    }`}
                  >
                    {word}
                  </button>
                ))}
              </div>
              <div className="text-center pt-2">
                <button
                  onClick={() => setGameState('result')}
                  disabled={selectedWords.length === 0}
                  className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold rounded-xl text-xs sm:text-sm transition"
                >
                  View Score ({selectedWords.length}/8)
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-6 bg-slate-950/80 rounded-2xl border border-slate-800 text-center space-y-4">
              <h3 className="text-xl sm:text-2xl font-bold text-white">Score: {calculateScore()} / 8</h3>
              <button onClick={startTask} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs sm:text-sm font-semibold border border-slate-700 transition">
                Retry
              </button>
            </div>
          )}
        </div>
      );
    }

    // ATTENTION GAME
    function AttentionGame() {
      const [gameState, setGameState] = useState('idle');
      const [grid, setGrid] = useState([]);
      const [foundCount, setFoundCount] = useState(0);
      const [totalTargets, setTotalTargets] = useState(0);
      const [time, setTime] = useState(0);
      const timerRef = useRef(null);

      const startAttentionTask = () => {
        const symbols = ['★', '▲', '●', '■', '◆', '✦'];
        const target = '★';

        let count = 0;
        const newGrid = Array.from({ length: 24 }).map(() => {
          const isTarget = Math.random() < 0.3;
          if (isTarget) count++;
          return {
            symbol: isTarget ? target : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1],
            isTarget,
            clicked: false
          };
        });

        setGrid(newGrid);
        setTotalTargets(count);
        setFoundCount(0);
        setTime(0);
        setGameState('playing');

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => setTime(prev => prev + 1), 1000);
      };

      const handleCellClick = (index) => {
        if (grid[index].clicked) return;
        const updated = [...grid];
        updated[index].clicked = true;
        setGrid(updated);
        if (updated[index].isTarget) setFoundCount(prev => prev + 1);
      };

      const finishTask = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setGameState('result');
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-8 bg-slate-950/40 rounded-2xl border border-slate-800">
              <button onClick={startAttentionTask} className="px-6 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-white text-sm transition shadow-lg shadow-emerald-600/20 active:scale-95">
                Start Attention Test
              </button>
            </div>
          )}

          {gameState === 'playing' && (
            <div className="space-y-6 bg-slate-950/60 p-4 sm:p-6 rounded-2xl border border-slate-800">
              <div className="flex justify-between items-center text-xs sm:text-sm font-medium">
                <span>Find target: <strong className="text-amber-400 text-base">★</strong></span>
                <span>Time: {time}s | Found: {foundCount}/{totalTargets}</span>
              </div>
              <div className="grid grid-cols-4 sm:grid-cols-6 gap-2 sm:gap-3">
                {grid.map((cell, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleCellClick(idx)}
                    className={`h-12 sm:h-14 rounded-xl text-lg sm:text-xl font-bold border transition active:scale-95 flex items-center justify-center ${
                      cell.clicked
                        ? cell.isTarget ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300' : 'bg-rose-900/30 border-rose-500 text-rose-300'
                        : 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700'
                    }`}
                  >
                    {cell.symbol}
                  </button>
                ))}
              </div>
              <div className="text-right pt-2">
                <button onClick={finishTask} className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs border border-slate-700 transition">
                  Finish
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-6 bg-slate-950/80 rounded-2xl border border-slate-800 text-center space-y-4">
              <h3 className="text-xl sm:text-2xl font-bold text-white">Result: {foundCount} / {totalTargets} in {time}s</h3>
              <button onClick={startAttentionTask} className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs sm:text-sm font-semibold border border-slate-700 transition">
                Retry
              </button>
            </div>
          )}
        </div>
      );
    }

    // MYTH VS FACT
    function MythFactQuiz({ quizData }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState(false);

      const currentItem = quizData[currentIndex] || quizData[0];
      const isAnswered = userAnswers[currentItem.id] !== undefined;
      const isCorrect = isAnswered && userAnswers[currentItem.id] === currentItem.isFact;

      const handleAnswer = (answerBool) => {
        if (isAnswered) return;
        setUserAnswers({ ...userAnswers, [currentItem.id]: answerBool });
        setShowExplanation(true);
      };

      const nextQuestion = () => {
        setShowExplanation(false);
        if (currentIndex < quizData.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="p-5 sm:p-8 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-6">
            <div className="text-xs text-indigo-400 font-bold uppercase tracking-wider">
              {currentIndex + 1} / {quizData.length}
            </div>

            <h3 className="text-lg sm:text-xl font-semibold text-white leading-snug">
              "{currentItem.statement}"
            </h3>

            <div className="grid grid-cols-2 gap-3 sm:gap-4">
              <button
                onClick={() => handleAnswer(false)}
                disabled={isAnswered}
                className={`py-3.5 px-3 rounded-xl font-bold text-xs sm:text-sm border transition ${
                  isAnswered && userAnswers[currentItem.id] === false
                    ? 'bg-indigo-600 text-white border-indigo-500'
                    : 'bg-slate-800 hover:bg-slate-700/80 border-slate-700 text-slate-200'
                }`}
              >
                MYTH
              </button>

              <button
                onClick={() => handleAnswer(true)}
                disabled={isAnswered}
                className={`py-3.5 px-3 rounded-xl font-bold text-xs sm:text-sm border transition ${
                  isAnswered && userAnswers[currentItem.id] === true
                    ? 'bg-indigo-600 text-white border-indigo-500'
                    : 'bg-slate-800 hover:bg-slate-700/80 border-slate-700 text-slate-200'
                }`}
              >
                FACT
              </button>
            </div>

            {showExplanation && (
              <div className={`p-4 rounded-2xl border text-xs sm:text-sm space-y-2 animate-fadeIn ${
                isCorrect ? 'bg-emerald-950/40 border-emerald-800/60 text-emerald-200' : 'bg-rose-950/40 border-rose-800/60 text-rose-200'
              }`}>
                <p className="leading-relaxed">{currentItem.explanation}</p>
              </div>
            )}

            {isAnswered && currentIndex < quizData.length - 1 && (
              <div className="text-right pt-2">
                <button onClick={nextQuestion} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs sm:text-sm transition">
                  Next Question
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
