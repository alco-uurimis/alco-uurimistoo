    // ==========================================
    // MEMORY GAME SUB-COMPONENT
    // ==========================================
    function MemoryGame() {
      const [gameState, setGameState] = useState('idle');
      const [currentWords, setCurrentWords] = useState([]);
      const [selectedWords, setSelectedWords] = useState([]);
      const [optionsGrid, setOptionsGrid] = useState([]);
      const [timer, setTimer] = useState(6);
      const [distractionAnswer, setDistractionAnswer] = useState('');
      const [distractionMath, setDistractionMath] = useState({ a: 7, b: 8 });

      const startTask = () => {
        const randomSet = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)];
        setCurrentWords(randomSet);

        const num1 = Math.floor(Math.random() * 12) + 5;
        const num2 = Math.floor(Math.random() * 12) + 5;
        setDistractionMath({ a: num1, b: num2 });
        setDistractionAnswer('');

        const distractorWords = ["Aine", "Laine", "Närv", "Unetus", "Mõju", "Põhjus", "Maks", "Tase"];
        const combined = [...randomSet, ...distractorWords].sort(() => Math.random() - 0.5);
        setOptionsGrid(combined);

        setSelectedWords([]);
        setGameState('memorizing');
        setTimer(6);
      };

      useEffect(() => {
        let interval = null;
        if (gameState === 'memorizing' && timer > 0) {
          interval = setInterval(() => setTimer(prev => prev - 1), 1000);
        } else if (gameState === 'memorizing' && timer === 0) {
          setGameState('distraction');
        }
        return () => clearInterval(interval);
      }, [gameState, timer]);

      const toggleWordSelect = (word) => {
        if (selectedWords.includes(word)) {
          setSelectedWords(selectedWords.filter(w => w !== word));
        } else {
          if (selectedWords.length < 8) {
            setSelectedWords([...selectedWords, word]);
          }
        }
      };

      const calculateScore = () => {
        let score = 0;
        selectedWords.forEach(w => {
          if (currentWords.includes(w)) score++;
        });
        return score;
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-8 space-y-4 bg-slate-950/40 rounded-2xl border border-slate-800">
              <p className="text-sm text-slate-300 max-w-md mx-auto">
                Sulle kuvatakse 6 sekundi jooksul 8 eestikeelset sõna. Pärast lühikest vaheülesannet pead meenutama, millised sõnad olid nimekirjas.
              </p>
              <button
                onClick={startTask}
                className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-white transition shadow-lg shadow-indigo-600/20"
              >
                Alusta mälutesti
              </button>
            </div>
          )}

          {gameState === 'memorizing' && (
            <div className="text-center py-8 space-y-6 bg-slate-950/60 rounded-2xl border border-slate-800">
              <div className="flex items-center justify-center space-x-2 text-indigo-400 font-bold text-lg">
                <span>Jäta meelde! Aega jäänud: {timer}s</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-lg mx-auto">
                {currentWords.map((word, idx) => (
                  <div key={idx} className="p-3 bg-slate-800 rounded-xl font-bold text-indigo-200 border border-slate-700">
                    {word}
                  </div>
                ))}
              </div>
            </div>
          )}

          {gameState === 'distraction' && (
            <div className="text-center py-8 space-y-4 bg-slate-950/60 rounded-2xl border border-slate-800 max-w-md mx-auto">
              <h3 className="font-bold text-white text-lg">Vaheülesanne (Tähelepanu hajutamine)</h3>
              <p className="text-xs text-slate-400">Lahenda lihtne tehe enne sõnade meenutamist:</p>
              
              <form onSubmit={(e) => { e.preventDefault(); setGameState('recall'); }} className="space-y-4">
                <div className="text-2xl font-extrabold text-indigo-300">
                  {distractionMath.a} + {distractionMath.b} = ?
                </div>
                <input
                  type="number"
                  value={distractionAnswer}
                  onChange={(e) => setDistractionAnswer(e.target.value)}
                  placeholder="Vastus"
                  required
                  className="px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-center text-white font-bold w-32 focus:outline-none"
                />
                <div>
                  <button
                    type="submit"
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white text-sm"
                  >
                    Edasi meenutamise juurde
                  </button>
                </div>
              </form>
            </div>
          )}

          {gameState === 'recall' && (
            <div className="space-y-6 bg-slate-950/60 p-6 rounded-2xl border border-slate-800">
              <div className="flex items-center justify-between">
                <h3 className="font-bold text-white">Vali 8 sõna, mis olid algses nimekirjas:</h3>
                <span className="text-xs text-indigo-400 font-semibold">{selectedWords.length} / 8 valitud</span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {optionsGrid.map((word, idx) => {
                  const isSelected = selectedWords.includes(word);
                  return (
                    <button
                      key={idx}
                      onClick={() => toggleWordSelect(word)}
                      className={`p-3 rounded-xl text-sm font-semibold border transition ${
                        isSelected
                          ? 'bg-indigo-600 text-white border-indigo-400'
                          : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
                      }`}
                    >
                      {word}
                    </button>
                  );
                })}
              </div>

              <div className="text-center pt-4">
                <button
                  onClick={() => setGameState('result')}
                  disabled={selectedWords.length === 0}
                  className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold rounded-xl text-sm transition"
                >
                  Vaata tulemust
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-6 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-6 text-center">
              <h3 className="text-2xl font-bold text-white">Sinu tulemus: {calculateScore()} / 8 õiget sõna</h3>
              <p className="text-xs text-slate-400">Lühimälu töötluse näidisharjutus</p>

              <button
                onClick={startTask}
                className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-semibold border border-slate-700 transition"
              >
                Proovi uuesti
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // ATTENTION GAME SUB-COMPONENT
    // ==========================================
    function AttentionGame() {
      const [gameState, setGameState] = useState('idle');
      const [grid, setGrid] = useState([]);
      const [foundCount, setFoundCount] = useState(0);
      const [totalTargets, setTotalTargets] = useState(0);
      const [time, setTime] = useState(0);
      const timerRef = useRef(null);

      const startAttentionTask = () => {
        const symbols = ['★', '▲', '●', '■', '◆', '✦'];
        const target = '★';

        let count = 0;
        const newGrid = Array.from({ length: 24 }).map(() => {
          const isTarget = Math.random() < 0.3;
          if (isTarget) count++;
          return {
            symbol: isTarget ? target : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1],
            isTarget,
            clicked: false
          };
        });

        setGrid(newGrid);
        setTotalTargets(count);
        setFoundCount(0);
        setTime(0);
        setGameState('playing');

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => {
          setTime(prev => prev + 1);
        }, 1000);
      };

      const handleCellClick = (index) => {
        if (grid[index].clicked) return;

        const updatedGrid = [...grid];
        updatedGrid[index].clicked = true;
        setGrid(updatedGrid);

        if (updatedGrid[index].isTarget) {
          setFoundCount(prev => prev + 1);
        }
      };

      const finishTask = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setGameState('result');
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-8 space-y-4 bg-slate-950/40 rounded-2xl border border-slate-800">
              <p className="text-sm text-slate-300 max-w-md mx-auto">
                Sulle kuvatakse sümbolite ruudustik. Sinu ülesandeks on leida ja klõpsata võimalikult kiiresti kõiki <span className="text-amber-400 font-bold">★</span> sümboleid.
              </p>
              <button
                onClick={startAttentionTask}
                className="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold text-white transition shadow-lg shadow-emerald-600/20"
              >
                Alusta tähelepanutesti
              </button>
            </div>
          )}

          {gameState === 'playing' && (
            <div className="space-y-6 bg-slate-950/60 p-6 rounded-2xl border border-slate-800">
              <div className="flex items-center justify-between text-sm">
                <div className="flex items-center space-x-2">
                  <span className="text-slate-400">Otsi sümbolit:</span>
                  <span className="text-amber-400 font-bold text-xl">★</span>
                </div>
                <div className="flex items-center space-x-4 text-xs font-semibold">
                  <span className="text-indigo-400">Aeg: {time}s</span>
                  <span className="text-emerald-400">Leitud: {foundCount} / {totalTargets}</span>
                </div>
              </div>

              <div className="grid grid-cols-4 sm:grid-cols-6 gap-3">
                {grid.map((cell, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleCellClick(idx)}
                    className={`h-14 rounded-xl text-xl font-bold border transition flex items-center justify-center ${
                      cell.clicked
                        ? cell.isTarget
                          ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300'
                          : 'bg-rose-900/30 border-rose-500 text-rose-300'
                        : 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700'
                    }`}
                  >
                    {cell.symbol}
                  </button>
                ))}
              </div>

              <div className="text-center pt-2">
                <button
                  onClick={finishTask}
                  className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl text-xs border border-slate-700 transition"
                >
                  Lõpeta test
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-6 bg-slate-950/80 rounded-2xl border border-slate-800 space-y-6 text-center">
              <h3 className="text-2xl font-bold text-white">Tähelepanutesti tulemused</h3>
              
              <div className="grid grid-cols-3 gap-4 max-w-md mx-auto">
                <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <div className="text-xs text-slate-400">Aeg</div>
                  <div className="text-lg font-bold text-indigo-400">{time}s</div>
                </div>
                <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <div className="text-xs text-slate-400">Leitud</div>
                  <div className="text-lg font-bold text-emerald-400">{foundCount} / {totalTargets}</div>
                </div>
                <div className="p-3 rounded-xl bg-slate-900 border border-slate-800">
                  <div className="text-xs text-slate-400">Täpsus</div>
                  <div className="text-lg font-bold text-purple-400">
                    {totalTargets > 0 ? Math.round((foundCount / totalTargets) * 100) : 0}%
                  </div>
                </div>
              </div>

              <button
                onClick={startAttentionTask}
                className="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-semibold border border-slate-700 transition"
              >
                Proovi uuesti
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MYTH VS FACT SUB-COMPONENT
    // ==========================================
    function MythFactQuiz() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState(false);

      const currentItem = MYTH_FACT_QUIZ[currentIndex];
      const isAnswered = userAnswers[currentItem.id] !== undefined;
      const isCorrect = isAnswered && userAnswers[currentItem.id] === currentItem.isFact;

      const handleAnswer = (answerBool) => {
        if (isAnswered) return;
        setUserAnswers({ ...userAnswers, [currentItem.id]: answerBool });
        setShowExplanation(true);
      };

      const nextQuestion = () => {
        setShowExplanation(false);
        if (currentIndex < MYTH_FACT_QUIZ.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="p-8 rounded-3xl bg-slate-900/90 border border-slate-800 space-y-6">
            <h3 className="text-xl font-semibold text-white leading-snug">
              "{currentItem.statement}"
            </h3>

            <div className="grid grid-cols-2 gap-4">
              <button
                onClick={() => handleAnswer(false)}
                disabled={isAnswered}
                className={`py-3.5 px-4 rounded-xl font-bold text-sm border transition ${
                  isAnswered && !currentItem.isFact 
                    ? 'bg-rose-600/30 border-rose-500 text-rose-200' 
                    : 'bg-slate-800 hover:bg-slate-700/80 border-slate-700 text-slate-200'
                }`}
              >
                MÜÜT
              </button>

              <button
                onClick={() => handleAnswer(true)}
                disabled={isAnswered}
                className={`py-3.5 px-4 rounded-xl font-bold text-sm border transition ${
                  isAnswered && currentItem.isFact 
                    ? 'bg-emerald-600/30 border-emerald-500 text-emerald-200' 
                    : 'bg-slate-800 hover:bg-slate-700/80 border-slate-700 text-slate-200'
                }`}
              >
                FAKT
              </button>
            </div>

            {showExplanation && (
              <div className={`p-4 rounded-2xl border text-sm space-y-2 animate-fadeIn ${
                isCorrect 
                  ? 'bg-emerald-950/40 border-emerald-800/60 text-emerald-200' 
                  : 'bg-rose-950/40 border-rose-800/60 text-rose-200'
              }`}>
                <div className="font-bold">{isCorrect ? 'Õige vastus!' : 'Vale vastus!'}</div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  {currentItem.explanation}
                </p>
              </div>
            )}

            {isAnswered && currentIndex < MYTH_FACT_QUIZ.length - 1 && (
              <div className="text-right">
                <button
                  onClick={nextQuestion}
                  className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs transition"
                >
                  Järgmine küsimus
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // RENDER APPLICATION
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
