    const { useState, useEffect, useRef, useLayoutEffect } = React;

    function LucideIcon({ name, className = "w-5 h-5", ...props }) {
      const iconRef = useRef(null);

      useLayoutEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            nameAttr: 'data-lucide',
            attrs: { class: className }
          });
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center" {...props} />;
    }

    function NeuralCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          if (canvas.parentElement) {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
          }
        };
        resize();
        window.addEventListener('resize', resize);

        const particles = Array.from({ length: 60 }).map(() => ({
          x: Math.random() * (canvas.width || 800),
          y: Math.random() * (canvas.height || 400),
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          radius: Math.random() * 2 + 1
        }));

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = `rgba(99, 102, 241, ${0.3 * (1 - dist / 120)})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#818cf8';
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(draw);
        };

        draw();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-50" />;
    }

    // НОВЫЙ ИНТЕРАКТИВНЫЙ ВИЗУАЛЬНЫЙ ВИДЖЕТ: Интерактивная схема нейрона с синаптическим импульсом

    function AlcoholBarSimulator({ lang }) {
      const [drinksCount, setDrinksCount] = useState(0);
      const [bloodAlcohol, setBloodAlcohol] = useState(0.0);
      const [drinkHistory, setDrinkHistory] = useState([]);

      const addDrink = (name, promilleAdd, emoji) => {
        setDrinksCount(prev => prev + 1);
        setBloodAlcohol(prev => Number((prev + promilleAdd).toFixed(2)));
        setDrinkHistory(prev => [...prev, { name, emoji, promille: promilleAdd }]);
      };

      const resetBar = () => {
        setDrinksCount(0);
        setBloodAlcohol(0.0);
        setDrinkHistory([]);
      };

      const getStatusDetails = () => {
        if (bloodAlcohol === 0) return { title: lang === 'et' ? 'Kaine / Täielik kontroll' : lang === 'en' ? 'Sober / Full Control' : 'Трезв / Полный контроль', color: 'text-emerald-400 bg-emerald-950/50 border-emerald-800/50' };
        if (bloodAlcohol < 0.5) return { title: lang === 'et' ? 'Kerge lõõgastus, tähelepanu hajub' : lang === 'en' ? 'Mild relaxation, attention drop' : 'Лёгкое расслабление, рассеянность внимания', color: 'text-amber-400 bg-amber-950/50 border-amber-800/50' };
        if (bloodAlcohol < 1.2) return { title: lang === 'et' ? 'Koordinatsiooni langus, reaktsioon aeglustub' : lang === 'en' ? 'Coordination loss, slowed reaction' : 'Снижение координации, замедленная реакция', color: 'text-orange-400 bg-orange-950/50 border-orange-800/50' };
        return { title: lang === 'et' ? 'Tugev joove, ohtlik mälulünkade risk!' : lang === 'en' ? 'Heavy intoxication, blackout risk!' : 'Сильное опьянение, риск блэкаутов!', color: 'text-rose-400 bg-rose-950/50 border-rose-800/50' };
      };

      const status = getStatusDetails();

      return (
        <div className="p-6 sm:p-8 rounded-3xl glass-card border border-rose-500/30 space-y-6 shadow-2xl glow-container">
          <div className="text-center space-y-2">
            <span className="px-3 py-1 bg-rose-950 border border-rose-700/50 text-rose-300 rounded-full text-xs font-bold uppercase tracking-wider">
              {lang === 'et' ? 'Interaktiivne Doosi ja Efekti Simulaator' : lang === 'en' ? 'Interactive Dose & Effect Simulator' : 'Интерактивный симулятор дозировки и эффекта'}
            </span>
            <h3 className="text-xl sm:text-2xl font-bold text-white">
              {lang === 'et' ? 'Virtuaalne baar ja etanooli akumulatsioon' : lang === 'en' ? 'Virtual bar & ethanol accumulation' : 'Виртуальный бар и накопление этанола'}
            </h3>
            <p className="text-xs sm:text-sm text-slate-400 max-w-lg mx-auto">
              {lang === 'et' ? 'Valige joogid, et näha reaalajas promillitõusu ja selle mõju aju kognitiivsetele funktsioonidele.' : lang === 'en' ? 'Select drinks to see real-time BAC increase and its cognitive impact.' : 'Выберите напитки, чтобы увидеть рост промилле в реальном времени.'}
            </p>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-xl mx-auto">
            <button 
              onClick={() => addDrink('Õlu / Beer', 0.2, '🍺')}
              className="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 rounded-2xl flex flex-col items-center gap-2 transition-all hover:scale-105 active:scale-95 group shadow-lg"
            >
              <span className="text-3xl group-hover:scale-125 transition-transform">🍺</span>
              <span className="text-xs font-bold text-slate-200">Õlu (0.33l) / Beer</span>
              <span className="text-xs text-rose-400 font-extrabold bg-rose-950/80 px-2 py-0.5 rounded-md">+0.2‰</span>
            </button>

            <button 
              onClick={() => addDrink('Vein / Wine', 0.35, '🍷')}
              className="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 rounded-2xl flex flex-col items-center gap-2 transition-all hover:scale-105 active:scale-95 group shadow-lg"
            >
              <span className="text-3xl group-hover:scale-125 transition-transform">🍷</span>
              <span className="text-xs font-bold text-slate-200">Vein (15cl) / Wine</span>
              <span className="text-xs text-rose-400 font-extrabold bg-rose-950/80 px-2 py-0.5 rounded-md">+0.35‰</span>
            </button>

            <button 
              onClick={() => addDrink('Viin / Spirit', 0.6, '🥃')}
              className="p-4 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 rounded-2xl flex flex-col items-center gap-2 transition-all hover:scale-105 active:scale-95 group shadow-lg"
            >
              <span className="text-3xl group-hover:scale-125 transition-transform">🥃</span>
              <span className="text-xs font-bold text-slate-200">Kange (4cl) / Spirit</span>
              <span className="text-xs text-rose-400 font-extrabold bg-rose-950/80 px-2 py-0.5 rounded-md">+0.6‰</span>
            </button>
          </div>

          <div className="bg-slate-950/80 p-5 rounded-2xl border border-slate-800 max-w-xl mx-auto space-y-4 shadow-xl">
            <div className="flex justify-between items-center text-xs sm:text-sm text-slate-300 font-medium px-2">
              <span>{lang === 'et' ? 'Joogid kokku:' : lang === 'en' ? 'Total drinks:' : 'Всего порций:'} <strong className="text-white text-base">{drinksCount}</strong></span>
              <span>{lang === 'et' ? 'Hinnanguline tase:' : lang === 'en' ? 'Estimated level:' : 'Уровень BAC:'} <strong className="text-rose-400 text-lg">{bloodAlcohol} ‰</strong></span>
            </div>

            {/* Visual meter bar */}
            <div className="w-full bg-slate-900 h-3 rounded-full overflow-hidden border border-slate-800 p-0.5">
              <div 
                className="bg-gradient-to-r from-emerald-500 via-amber-500 to-rose-600 h-full rounded-full transition-all duration-500"
                style={{ width: `${Math.min((bloodAlcohol / 2.5) * 100, 100)}%` }}
              ></div>
            </div>

            <div className={`p-3 rounded-xl border text-xs sm:text-sm font-bold text-center ${status.color}`}>
              {status.title}
            </div>

            {drinkHistory.length > 0 && (
              <div className="flex flex-wrap gap-1.5 pt-2 justify-center">
                {drinkHistory.map((d, idx) => (
                  <span key={idx} className="px-2.5 py-1 bg-slate-900 border border-slate-800 rounded-lg text-xs flex items-center gap-1 text-slate-300">
                    <span>{d.emoji}</span>
                    <span>+{d.promille}‰</span>
                  </span>
                ))}
              </div>
            )}

            {drinksCount > 0 && (
              <div className="text-center pt-2">
                <button 
                  onClick={resetBar}
                  className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-indigo-400 border border-slate-700 rounded-xl text-xs font-semibold transition active:scale-95"
                >
                  {lang === 'et' ? 'Nulli tulemus (kainene)' : lang === 'en' ? 'Reset bar' : 'Сбросить симуляцию'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function MemoryGame({ lang }) {
      const [gameState, setGameState] = useState('idle');
      const [currentWords, setCurrentWords] = useState([]);
      const [selectedWords, setSelectedWords] = useState([]);
      const [optionsGrid, setOptionsGrid] = useState([]);
      const [timer, setTimer] = useState(6);
      const [distractionAnswer, setDistractionAnswer] = useState('');
      const [distractionMath, setDistractionMath] = useState({ a: 7, b: 8 });

      const startTask = () => {
        const wordBank = WORD_BANK_I18N[lang] || WORD_BANK_I18N.et;
        const randomSet = wordBank[Math.floor(Math.random() * wordBank.length)];
        setCurrentWords(randomSet);

        const num1 = Math.floor(Math.random() * 12) + 5;
        const num2 = Math.floor(Math.random() * 12) + 5;
        setDistractionMath({ a: num1, b: num2 });
        setDistractionAnswer('');

        const distractors = DISTRACTORS_I18N[lang] || DISTRACTORS_I18N.et;
        const combined = [...randomSet, ...distractors].sort(() => Math.random() - 0.5);
        setOptionsGrid(combined);

        setSelectedWords([]);
        setGameState('memorizing');
        setTimer(6);
      };

      useEffect(() => {
        let interval = null;
        if (gameState === 'memorizing' && timer > 0) {
          interval = setInterval(() => setTimer(prev => prev - 1), 1000);
        } else if (gameState === 'memorizing' && timer === 0) {
          setGameState('distraction');
        }
        return () => clearInterval(interval);
      }, [gameState, timer]);

      const toggleWordSelect = (word) => {
        if (selectedWords.includes(word)) {
          setSelectedWords(selectedWords.filter(w => w !== word));
        } else {
          if (selectedWords.length < 8) {
            setSelectedWords([...selectedWords, word]);
          }
        }
      };

      const calculateScore = () => {
        let score = 0;
        selectedWords.forEach(w => {
          if (currentWords.includes(w)) score++;
        });
        if (score === 8 && window.confetti) {
          window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        }
        return score;
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-10 space-y-4 bg-slate-950/50 rounded-2xl border border-slate-800">
              <button
                onClick={startTask}
                className="px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 font-bold text-white text-sm transition-all shadow-xl shadow-indigo-600/30 hover:scale-105 active:scale-95"
              >
                {lang === 'et' ? 'Alusta mälu testi' : lang === 'en' ? 'Start Memory Test' : 'Начать тест памяти'}
              </button>
            </div>
          )}

          {gameState === 'memorizing' && (
            <div className="text-center py-10 space-y-6 bg-slate-950/70 rounded-2xl border border-slate-800 px-4 animate-fadeIn">
              <div className="inline-flex items-center space-x-2 px-4 py-1.5 bg-indigo-950 border border-indigo-700/50 text-indigo-300 rounded-full font-bold text-sm">
                <span>Jäta meelde sõnad ({timer}s)</span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-xl mx-auto">
                {currentWords.map((word, idx) => (
                  <div key={idx} className="p-4 bg-slate-900 rounded-2xl font-bold text-indigo-200 border border-indigo-500/30 text-sm shadow-md animate-pulse">
                    {word}
                  </div>
                ))}
              </div>
            </div>
          )}

          {gameState === 'distraction' && (
            <div className="text-center py-10 space-y-5 bg-slate-950/70 rounded-2xl border border-slate-800 max-w-md mx-auto px-6 animate-fadeIn">
              <form onSubmit={(e) => { e.preventDefault(); setGameState('recall'); }} className="space-y-4">
                <div className="text-xs text-indigo-400 font-semibold uppercase tracking-wider">Häiriv ülesanne / Kognitiivne test</div>
                <div className="text-3xl font-black text-white">
                  {distractionMath.a} + {distractionMath.b} = ?
                </div>
                <input
                  type="number"
                  value={distractionAnswer}
                  onChange={(e) => setDistractionAnswer(e.target.value)}
                  required
                  autoFocus
                  className="px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-white font-bold w-40 focus:outline-none focus:border-indigo-500 text-lg shadow-inner"
                />
                <div>
                  <button type="submit" className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-white text-sm transition-all shadow-lg shadow-indigo-600/30">
                    Jätka (Esita)
                  </button>
                </div>
              </form>
            </div>
          )}

          {gameState === 'recall' && (
            <div className="space-y-6 bg-slate-950/70 p-6 rounded-2xl border border-slate-800 animate-fadeIn">
              <div className="text-center text-xs font-semibold text-slate-400">Vali ülesjäänud 8 õiget sõna:</div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                {optionsGrid.map((word, idx) => (
                  <button
                    key={idx}
                    onClick={() => toggleWordSelect(word)}
                    className={`p-4 rounded-2xl text-xs sm:text-sm font-bold border transition-all ${
                      selectedWords.includes(word)
                        ? 'bg-indigo-600 text-white border-indigo-400 shadow-lg shadow-indigo-600/30 scale-105'
                        : 'bg-slate-900 text-slate-300 border-slate-700 hover:bg-slate-800'
                    }`}
                  >
                    {word}
                  </button>
                ))}
              </div>
              <div className="text-center pt-2">
                <button
                  onClick={() => setGameState('result')}
                  disabled={selectedWords.length === 0}
                  className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-2xl text-sm transition-all shadow-lg shadow-emerald-600/30"
                >
                  Vaata tulemust ({selectedWords.length}/8)
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-8 bg-slate-950/90 rounded-2xl border border-slate-800 text-center space-y-5 animate-fadeIn shadow-2xl">
              <h3 className="text-2xl sm:text-3xl font-black text-white">Tulemus: {calculateScore()} / 8</h3>

              <button onClick={startTask} className="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-sm font-bold border border-slate-700 transition-all shadow-md">
                Proovi uuesti
              </button>
            </div>
          )}
        </div>
      );
    }

    function AttentionGame({ lang }) {
      const [gameState, setGameState] = useState('idle');
      const [grid, setGrid] = useState([]);
      const [foundCount, setFoundCount] = useState(0);
      const [totalTargets, setTotalTargets] = useState(0);
      const [time, setTime] = useState(0);
      const timerRef = useRef(null);

      const startAttentionTask = () => {
        const symbols = ['★', '▲', '●', '■', '◆', '✦'];
        const target = '★';

        let count = 0;
        const newGrid = Array.from({ length: 24 }).map(() => {
          const isTarget = Math.random() < 0.3;
          if (isTarget) count++;
          return {
            symbol: isTarget ? target : symbols[Math.floor(Math.random() * (symbols.length - 1)) + 1],
            isTarget,
            clicked: false
          };
        });

        setGrid(newGrid);
        setTotalTargets(count);
        setFoundCount(0);
        setTime(0);
        setGameState('playing');

        if (timerRef.current) clearInterval(timerRef.current);
        timerRef.current = setInterval(() => setTime(prev => prev + 1), 1000);
      };

      const handleCellClick = (index) => {
        if (grid[index].clicked) return;
        const updated = [...grid];
        updated[index].clicked = true;
        setGrid(updated);
        if (updated[index].isTarget) {
          const newFound = foundCount + 1;
          setFoundCount(newFound);
          if (newFound === totalTargets) {
            if (timerRef.current) clearInterval(timerRef.current);
            setGameState('result');
            if (window.confetti) {
              window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            }
          }
        }
      };

      const finishTask = () => {
        if (timerRef.current) clearInterval(timerRef.current);
        setGameState('result');
      };

      return (
        <div className="space-y-6">
          {gameState === 'idle' && (
            <div className="text-center py-10 bg-slate-950/50 rounded-2xl border border-slate-800">
              <button onClick={startAttentionTask} className="px-8 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white text-sm transition-all shadow-xl shadow-emerald-600/30 hover:scale-105 active:scale-95">
                {lang === 'et' ? 'Alusta tähelepanu testi' : lang === 'en' ? 'Start Attention Test' : 'Начать тест внимания'}
              </button>
            </div>
          )}

          {gameState === 'playing' && (
            <div className="space-y-6 bg-slate-950/70 p-6 rounded-2xl border border-slate-800 animate-fadeIn">
              <div className="flex justify-between items-center text-xs sm:text-sm font-bold bg-slate-900 px-4 py-3 rounded-xl border border-slate-800">
                <span className="flex items-center gap-1.5">Sihtmärk: <strong className="text-amber-400 text-lg">★</strong></span>
                <span>Aeg: <strong className="text-white">{time}s</strong> | Leitud: <strong className="text-emerald-400">{foundCount}/{totalTargets}</strong></span>
              </div>
              <div className="grid grid-cols-4 sm:grid-cols-6 gap-3">
                {grid.map((cell, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleCellClick(idx)}
                    className={`h-14 sm:h-16 rounded-2xl text-xl sm:text-2xl font-bold border transition-all active:scale-95 flex items-center justify-center shadow-md ${
                      cell.clicked
                        ? cell.isTarget ? 'bg-emerald-600/30 border-emerald-500 text-emerald-300 scale-95' : 'bg-rose-950/40 border-rose-600 text-rose-300 opacity-60 scale-95'
                        : 'bg-slate-900 border-slate-700/80 text-slate-200 hover:bg-slate-800 hover:border-slate-600'
                    }`}
                  >
                    {cell.symbol}
                  </button>
                ))}
              </div>
              <div className="text-right pt-2">
                <button onClick={finishTask} className="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-xs font-semibold border border-slate-700 transition-all shadow-md">
                  Lõpeta test
                </button>
              </div>
            </div>
          )}

          {gameState === 'result' && (
            <div className="p-8 bg-slate-950/90 rounded-2xl border border-slate-800 text-center space-y-5 animate-fadeIn shadow-2xl">
              <h3 className="text-2xl sm:text-3xl font-black text-white">Tulemus: {foundCount} / {totalTargets} {time}s jooksul</h3>
              <p className="text-sm text-slate-300">Tähelepanu kiirus ja fookus on kriitilised näitajad vaimses soorituses.</p>
              <button onClick={startAttentionTask} className="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-slate-200 rounded-xl text-sm font-bold border border-slate-700 transition-all shadow-md">
                Proovi uuesti
              </button>
            </div>
          )}
        </div>
      );
    }

    function MythFactQuiz({ quizData, lang }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [showExplanation, setShowExplanation] = useState(false);

      const currentItem = quizData[currentIndex] || quizData[0];
      const isAnswered = userAnswers[currentItem.id] !== undefined;
      const isCorrect = isAnswered && userAnswers[currentItem.id] === currentItem.isFact;

      const handleAnswer = (answerBool) => {
        if (isAnswered) return;
        setUserAnswers({ ...userAnswers, [currentItem.id]: answerBool });
        setShowExplanation(true);
        if (answerBool === currentItem.isFact && window.confetti) {
          window.confetti({ particleCount: 50, spread: 50, origin: { y: 0.6 } });
        }
      };

      const nextQuestion = () => {
        setShowExplanation(false);
        if (currentIndex < quizData.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      return (
        <div className="max-w-2xl mx-auto space-y-6">
          <div className="p-6 sm:p-10 rounded-3xl glass-card border border-slate-800 space-y-6 shadow-2xl animate-fadeIn">
            <div className="flex items-center justify-between">
              <span className="px-3 py-1 bg-purple-950 border border-purple-800 text-purple-300 rounded-full text-xs font-bold uppercase tracking-wider">
                Küsimus {currentIndex + 1} / {quizData.length}
              </span>
            </div>

            <h3 className="text-lg sm:text-2xl font-bold text-white leading-snug">
              "{currentItem.statement}"
            </h3>

            <div className="grid grid-cols-2 gap-4">
              <button
                onClick={() => handleAnswer(false)}
                disabled={isAnswered}
                className={`py-4 px-4 rounded-2xl font-extrabold text-sm sm:text-base border transition-all shadow-lg ${
                  isAnswered && userAnswers[currentItem.id] === false
                    ? 'bg-indigo-600 text-white border-indigo-400 scale-105'
                    : 'bg-slate-900 hover:bg-slate-800 border-slate-700/80 text-slate-200'
                }`}
              >
                {lang === 'et' ? 'MÜÜT' : lang === 'en' ? 'MYTH' : 'МИФ'}
              </button>

              <button
                onClick={() => handleAnswer(true)}
                disabled={isAnswered}
                className={`py-4 px-4 rounded-2xl font-extrabold text-sm sm:text-base border transition-all shadow-lg ${
                  isAnswered && userAnswers[currentItem.id] === true
                    ? 'bg-indigo-600 text-white border-indigo-400 scale-105'
                    : 'bg-slate-900 hover:bg-slate-800 border-slate-700/80 text-slate-200'
                }`}
              >
                {lang === 'et' ? 'FAKT' : lang === 'en' ? 'FACT' : 'ФАКТ'}
              </button>
            </div>

            {showExplanation && (
              <div className={`p-5 rounded-2xl border text-sm sm:text-base space-y-2 animate-fadeIn shadow-xl ${
                isCorrect ? 'bg-emerald-950/60 border-emerald-600 text-emerald-200' : 'bg-rose-950/60 border-rose-600 text-rose-200'
              }`}>
                <p className="leading-relaxed font-medium">{currentItem.explanation}</p>
              </div>
            )}

            {isAnswered && currentIndex < quizData.length - 1 && (
              <div className="text-right pt-2">
                <button onClick={nextQuestion} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/30">
                  {lang === 'et' ? 'Järgmine küsimus' : lang === 'en' ? 'Next Question' : 'Следующий вопрос'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
